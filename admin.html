<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>ניהול אתר מיטגלגלים</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: Arial, sans-serif; background: #f3f4f6; color: #1f2937; margin: 0; padding: 16px; }
    .wrap { max-width: 640px; margin: 0 auto; }
    h1 { color: #991b1b; font-size: 26px; margin: 8px 0 16px; }
    .card { background: #fff; border-radius: 14px; padding: 16px; margin-bottom: 16px; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
    .card h2 { margin: 0 0 12px; font-size: 20px; color: #991b1b; }
    .hint { color: #6b7280; font-size: 14px; margin: -6px 0 12px; }
    .row { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid #f3f4f6; flex-wrap: wrap; }
    .row:last-child { border-bottom: 0; }
    .row .label { flex: 1; min-width: 110px; font-weight: bold; }
    input, select, button { font: inherit; font-size: 16px; }
    input, select { padding: 8px; border: 1px solid #d1d5db; border-radius: 8px; background: #fff; }
    input[type=time] { width: 112px; direction: ltr; }
    input.price { width: 90px; text-align: center; direction: ltr; }
    input.note { flex: 1; min-width: 160px; }
    input[type=checkbox] { width: 20px; height: 20px; }
    .times { display: flex; gap: 6px; align-items: center; direction: ltr; }
    .times.off { opacity: .35; pointer-events: none; }
    .exc { background: #fef2f2; border-radius: 10px; padding: 10px; margin-bottom: 10px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .btn { border: 0; border-radius: 999px; padding: 10px 18px; cursor: pointer; font-weight: bold; }
    .btn-main { background: #b91c1c; color: #fff; }
    .btn-main:disabled { background: #9ca3af; }
    .btn-light { background: #fee2e2; color: #991b1b; }
    .btn-del { background: none; border: 0; color: #b91c1c; font-size: 22px; cursor: pointer; margin-inline-start: auto; }
    .save-area { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    .save-area .btn-main { font-size: 20px; padding: 14px 40px; }
    #status { flex: 1; font-size: 16px; font-weight: bold; }
    .ok { color: #15803d; } .err { color: #b91c1c; }
    #loading { text-align: center; padding: 40px; color: #6b7280; }
  </style>
</head>
<body>
<div class="wrap">
  <h1>ניהול אתר מיטגלגלים</h1>
  <div id="loading">טוען…</div>
  <div id="app" hidden>
    <div class="card">
      <h2>סיסמה</h2>
      <input id="password" type="password" placeholder="סיסמת ניהול" autocomplete="current-password" style="width:100%">
    </div>

    <div class="card">
      <h2>מחירים</h2>
      <div id="menu"></div>
    </div>

    <div class="card">
      <h2>שעות פתיחה קבועות</h2>
      <p class="hint">סמנו את הימים שבהם הטראק פתוח</p>
      <div id="hours"></div>
    </div>

    <div class="card">
      <h2>חריגים חד-פעמיים</h2>
      <p class="hint">יום סגור, שעות אחרות מהרגיל, או פתיחה ביום שבדרך כלל סגור. חריגים שתאריכם עבר נמחקים לבד.</p>
      <div id="exceptions"></div>
      <button class="btn btn-light" onclick="addException()">+ הוספת חריג</button>
    </div>

    <div class="card save-area">
      <button id="save" class="btn btn-main" onclick="save()" disabled>שמירה</button>
      <span id="status"></span>
    </div>
  </div>
</div>


<script>
  // Google Apps Script שמחובר לגיליון "מיטגלגלים - ניהול אתר"
  const API_URL = 'https://script.google.com/macros/s/AKfycbxyG_wAwASpTawW4DG1XAaqgOYoKWlKXEXfbHizb3P2cJSvfdSeFJ6B5VlqfqVOE3Q/exec';
  const DAYS = ['ראשון', 'שני', 'שלישי', 'רביעי', 'חמישי', 'שישי', 'שבת'];

  function el(tag, attrs, children) {
    const e = document.createElement(tag);
    Object.entries(attrs || {}).forEach(([k, v]) => {
      if (k === 'text') e.textContent = v;
      else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
      else if (v !== false && v != null) e.setAttribute(k, v === true ? '' : v);
    });
    (children || []).forEach(c => e.appendChild(c));
    return e;
  }

  function setStatus(msg, cls) {
    const s = document.getElementById('status');
    s.textContent = msg;
    s.className = cls || '';
  }

  function render(data) {
    const menu = document.getElementById('menu');
    menu.innerHTML = '';
    data.menu.forEach(m => {
      menu.appendChild(el('div', { class: 'row', 'data-id': m.id, 'data-name': m.name }, [
        el('span', { class: 'label', text: m.name }),
        el('input', { class: 'price', value: m.price, inputmode: 'text' }),
        el('span', { text: '₪' }),
      ]));
    });

    const hours = document.getElementById('hours');
    hours.innerHTML = '';
    DAYS.forEach((d, i) => {
      const h = data.hours.find(x => x.day === i);
      const times = el('div', { class: 'times' + (h ? '' : ' off') }, [
        el('input', { type: 'time', class: 'open', value: h ? h.open : '11:00' }),
        el('span', { text: '-' }),
        el('input', { type: 'time', class: 'close', value: h ? h.close : '17:00' }),
      ]);
      const cb = el('input', { type: 'checkbox', checked: !!h,
        onchange: e => times.classList.toggle('off', !e.target.checked) });
      hours.appendChild(el('div', { class: 'row', 'data-day': i }, [
        el('label', { class: 'label' }, [cb, document.createTextNode(' יום ' + d)]),
        times,
      ]));
    });

    document.getElementById('exceptions').innerHTML = '';
    data.exceptions.forEach(addException);
  }

  function addException(x) {
    x = x && x.date ? x : { date: '', closed: true, open: '11:00', close: '17:00', note: '' };
    const times = el('div', { class: 'times' + (x.closed ? ' off' : '') }, [
      el('input', { type: 'time', class: 'open', value: x.open || '11:00' }),
      el('span', { text: '-' }),
      el('input', { type: 'time', class: 'close', value: x.close || '17:00' }),
    ]);
    const kind = el('select', { class: 'kind', onchange: e => times.classList.toggle('off', e.target.value === 'closed') }, [
      el('option', { value: 'closed', text: 'סגור', selected: x.closed }),
      el('option', { value: 'open', text: 'פתוח בשעות', selected: !x.closed }),
    ]);
    const row = el('div', { class: 'exc' }, [
      el('input', { type: 'date', class: 'date', value: x.date }),
      kind,
      times,
      el('input', { class: 'note', placeholder: 'הערה שתוצג באתר (לא חובה)', value: x.note || '' }),
    ]);
    row.appendChild(el('button', { class: 'btn-del', title: 'מחיקה', text: '×', onclick: () => row.remove() }));
    document.getElementById('exceptions').appendChild(row);
  }

  function collect() {
    const menu = [...document.querySelectorAll('#menu .row')].map(r => ({
      id: r.dataset.id, name: r.dataset.name, price: r.querySelector('.price').value,
    }));
    const hours = [...document.querySelectorAll('#hours .row')]
      .filter(r => r.querySelector('input[type=checkbox]').checked)
      .map(r => ({ day: Number(r.dataset.day), open: r.querySelector('.open').value, close: r.querySelector('.close').value }));
    const exceptions = [...document.querySelectorAll('#exceptions .exc')].map(r => ({
      date: r.querySelector('.date').value,
      closed: r.querySelector('.kind').value === 'closed',
      open: r.querySelector('.open').value,
      close: r.querySelector('.close').value,
      note: r.querySelector('.note').value,
    }));
    if (exceptions.some(x => !x.date)) throw new Error('יש חריג בלי תאריך');
    return { menu, hours, exceptions };
  }

  function save() {
    const password = document.getElementById('password').value;
    if (!password) return setStatus('הקלידו סיסמה', 'err');
    let data;
    try { data = collect(); } catch (e) { return setStatus(e.message, 'err'); }
    const btn = document.getElementById('save');
    btn.disabled = true;
    setStatus('שומר…');
    // text/plain כדי שהדפדפן לא ישלח בקשת CORS מקדימה ש-Apps Script לא עונה עליה
    fetch(API_URL, { method: 'POST', body: JSON.stringify({ password, data }) })
      .then(res => res.json())
      .then(res => {
        if (!res.ok) throw new Error(res.error);
        try { localStorage.setItem('mg-admin-pw', password); } catch (e) {}
        render(res.data);
        setStatus('נשמר! האתר יתעדכן תוך כמה שניות', 'ok');
      })
      .catch(err => setStatus(err.message || 'השמירה נכשלה, נסו שוב', 'err'))
      .finally(() => { btn.disabled = false; });
  }

  fetch(API_URL + '?action=data&t=' + Date.now())
    .then(res => res.json())
    .then(data => {
      render(data);
      try { document.getElementById('password').value = localStorage.getItem('mg-admin-pw') || ''; } catch (e) {}
      document.getElementById('loading').hidden = true;
      document.getElementById('app').hidden = false;
      document.getElementById('save').disabled = false;
    })
    .catch(() => {
      document.getElementById('loading').textContent = 'שגיאה בטעינה. בדקו את החיבור לאינטרנט ורעננו את הדף.';
    });
</script>
</body>
</html>
